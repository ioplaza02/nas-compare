name: バッファローのデータ取得

on:
  # 毎日 深夜3:30（日本時間）に自動実行。NASセレクター（3:00）と重ならないよう30分ずらしています
  schedule:
    - cron: "30 18 * * *"
  # Actions画面の「Run workflow」ボタンから手動でも実行できます
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 取得に失敗した・読めたシリーズが少なすぎる場合は、本番データを上書きせずにここで失敗終了します
      # （失敗するとGitHubから登録メールアドレスに通知が届きます）
      - name: バッファロー公式サイトから取得
        run: node scripts/scrape-buffalo.mjs --save-html

      - name: 取得結果を保存（コミット）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/buffalo-products.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "バッファローのデータを更新"
            git push
          fi

      # 成功・失敗どちらでも、確認用に取得したHTMLと失敗時の結果を残す（Actionsの実行結果画面からダウンロード可）
      - name: 確認用ファイルを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buffalo-debug
          path: |
            debug/
            data/buffalo-products.failed.json
          if-no-files-found: ignore
          retention-days: 14
